services:
  postgres:
    image: postgres:16-alpine
    container_name: medisearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medisearch
      POSTGRES_PASSWORD: medisearch_dev
      POSTGRES_DB: medisearch
    ports:
      - "5432:5432"
    volumes:
      - medisearch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisearch -d medisearch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medisearch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - medisearch_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  semantic-engine:
    build:
      context: ./server/semantic_engine
      dockerfile: Dockerfile
    container_name: medisearch-semantic-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NPROBE=24
      - RERANK_POOL_MAX=50
    volumes:
      - medisearch_huggingface_cache:/root/.cache/huggingface

volumes:
  medisearch_pgdata:
  medisearch_redisdata:
  medisearch_huggingface_cache:
